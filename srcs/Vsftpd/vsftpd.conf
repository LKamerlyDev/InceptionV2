listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
guest_enable=YES
anon_mkdir_write_enable=YES
guest_username=vsftp
virtual_use_local_privs=YES
anon_upload_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
user_sub_token=$USER
local_root=/var/ftp

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

xferlog_enable=YES
